name: Build macOS DMG

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # only used to attach the DMG to a GitHub Release on v* tags

jobs:
  dmg:
    runs-on: macos-15   # Apple Silicon (arm64) runner -> native build for M-series Macs
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build app + DMG
        run: PYTHON=python ./build_dmg.sh

      - name: Smoke test (launch the built app, it must stay alive)
        run: |
          set +e
          ./dist/myDB.app/Contents/MacOS/myDB --search > build/smoke.log 2>&1 &
          PID=$!
          sleep 20
          screencapture -x build/screenshot.png
          if kill -0 $PID 2>/dev/null; then
            echo "App is running OK"; kill $PID
          else
            wait $PID; echo "App exited with code $?"; cat build/smoke.log; exit 1
          fi
          cat build/smoke.log

      - name: Verify DMG
        run: |
          hdiutil verify dist/*.dmg
          ls -lh dist/*.dmg
          lipo -archs dist/myDB.app/Contents/MacOS/myDB

      - uses: actions/upload-artifact@v4
        with:
          name: myDB-macOS-dmg
          path: dist/*.dmg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshot
          path: build/screenshot.png
          if-no-files-found: ignore

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
